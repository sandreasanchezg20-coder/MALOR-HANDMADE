    <link rel="stylesheet" href="catalogo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- MENÚ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="inicio.html">MALORÈ HANDMADE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="inicio.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="catálogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="video.html">Video</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contactos.html">Contáctanos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">
                            🛒 Carrito <span id="contador">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CATÁLOGO -->
    <main class="container my-5">
        <div class="text-center mb-5">
            <h1 class="titulo">Catálogo</h1>
            <p class="descripcion text-muted">Descubre nuestra colección de moda y estilo.</p>
        </div>

        <div class="row g-4">

            <!-- PRODUCTO 1 -->
            <div class="col-md-4 d-flex">
                <div class="card producto h-100 w-100 shadow-sm">
                    <div class="contenedor-img">
                        <img src="img/bolso6.jpg" class="card-img-top" alt="Bolso Pearl">
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h3>Bolso Pearl<h3>
                        <p class="text-muted"></p>
                        <h4 class="mt-auto fw-bold"></h4>
                        <p class="small text-secondary mb-3"></p>
                        <button class="btn btn-dark w-100 mt-auto" onclick="agregarAlCarrito('Vestido Ejecutivo', 'img/vestido1.jpg')">
                            🛒 Agregar al carrito
                        </button>
                    </div>
                </div>
            </div>

            <!-- PRODUCTO 2 -->
            <div class="col-md-4 d-flex">
                <div class="card producto h-100 w-100 shadow-sm">
                    <div class="contenedor-img">
                        <img src="img/bolso5.jpg" class="card-img-top" alt="Vestido azul">
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h3>Bolso Noire </h3>
                        <p class="text-muted"></p>
                        <h4 class="mt-auto fw-bold"></h4>
                        <p class="small text-secondary mb-3"></p>
                        <button class="btn btn-dark w-100 mt-auto" onclick="agregarAlCarrito('Vestido Azul', 'img/vestido2.jpg')">
                            🛒 Agregar al carrito
                        </button>
                    </div>
                </div>
            </div>

            <!-- PRODUCTO 3 -->
            <div class="col-md-4 d-flex">
                <div class="card producto h-100 w-100 shadow-sm">
                    <div class="contenedor-img">
                        <img src="img/bolso7.jpg" class="card-img-top" alt="Conjunto ejecutivo">
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h3>Bolso Moka</h3>
                        <p class="text-muted"></p>
                        <h4 class="mt-auto fw-bold"></h4>
                        <p class="small text-secondary mb-3"></p>
                        <button class="btn btn-dark w-100 mt-auto" onclick="agregarAlCarrito('Conjunto Ejecutivo', 'img/conjunto1.jpg')">
                            🛒 Agregar al carrito
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- JAVASCRIPT DEL CARRITO -->
    <script>
        function agregarAlCarrito(nombre, precio, imagen) {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
            let productoExistente = carrito.find(producto => producto.nombre === nombre);

            if (productoExistente) {
                productoExistente.cantidad++;
            } else {
                carrito.push({
                    nombre: nombre,
                    precio: precio,
                    imagen: imagen,
                    cantidad: 1
                });
            }

            localStorage.setItem("carrito", JSON.stringify(carrito));
            actualizarContador();
            alert("¡Producto agregado al carrito! 🛍️");
        }

        function actualizarContador() {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
            let cantidad = 0;
            carrito.forEach(producto => { cantidad += producto.cantidad; });
            document.getElementById("contador").innerText = cantidad;
        }

        actualizarContador();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
